<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>不同形狀在氣流中的效果模擬</title>
  <style>
    :root {
      --bg: #081b2b;
      --panel: rgba(8, 27, 43, 0.95);
      --panel-alt: rgba(15, 48, 80, 0.92);
      --text: #e5f7ff;
      --accent: #4fd6ff;
      --accent-2: #a4ffb2;
      --danger: #ff7a7a;
      --shadow: 0 18px 56px rgba(0, 0, 0, 0.35);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #122a47 0%, #04131f 42%, #030a13 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: min(1300px, 100%);
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 28px;
      align-items: stretch;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 20px 26px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel-header h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 2rem);
      letter-spacing: 0.02em;
    }

    .panel-header p {
      margin: 8px 0 0;
      color: rgba(229, 247, 255, 0.77);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .canvas-wrap {
      position: relative;
      flex: 1;
      min-height: 560px;
      background: radial-gradient(circle at top left, rgba(79, 214, 255, 0.12), transparent 28%),
                  radial-gradient(circle at bottom right, rgba(164, 255, 178, 0.08), transparent 24%);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .info-panel {
      display: grid;
      gap: 18px;
      padding: 24px 26px 24px;
    }

    .shape-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .shape-button {
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      padding: 14px 16px;
      cursor: pointer;
      font-size: 0.98rem;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .shape-button:hover {
      transform: translateY(-1px);
      border-color: rgba(79, 214, 255, 0.55);
    }

    .shape-button.active {
      background: rgba(79, 214, 255, 0.14);
      border-color: rgba(79, 214, 255, 0.85);
      color: #e8fbff;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: var(--panel-alt);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px 20px;
      min-height: 110px;
    }

    .stat-card h3 {
      margin: 0 0 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #c7e6ff;
    }

    .stat-card p {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .control-panel {
      display: grid;
      gap: 18px;
      padding: 24px 26px 28px;
    }

    .control-panel label {
      display: grid;
      gap: 10px;
      color: rgba(229, 247, 255, 0.9);
      font-size: 0.95rem;
    }

    .slider-wrap {
      display: grid;
      gap: 10px;
    }

    .slider-wrap input[type='range'] {
      width: 100%;
      accent-color: var(--accent);
    }

    .slider-value {
      display: flex;
      justify-content: space-between;
      font-size: 0.92rem;
      color: rgba(229, 247, 255, 0.75);
    }

    .notes {
      color: rgba(229, 247, 255, 0.75);
      font-size: 0.9rem;
      line-height: 1.65;
    }

    @media (max-width: 980px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .panel {
        border-radius: 20px;
      }
      .shape-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="panel-header">
        <h1>不同形狀在氣流中的效果模擬</h1>
        <p>切換形狀並調整風速，觀察阻力、升力、尾流與分離情況。使用 Canvas 即時渲染氣流粒子動畫。</p>
      </div>
      <div class="canvas-wrap">
        <canvas id="flowCanvas"></canvas>
      </div>
    </div>

    <div class="panel info-panel">
      <div class="shape-buttons" id="shapeButtons"></div>

      <div class="stat-grid">
        <div class="stat-card">
          <h3>阻力係數 Cd</h3>
          <p id="cdValue">0.00</p>
        </div>
        <div class="stat-card">
          <h3>升力係數 Cl</h3>
          <p id="clValue">0.00</p>
        </div>
        <div class="stat-card">
          <h3>尾流長度</h3>
          <p id="wakeValue">0.0</p>
        </div>
        <div class="stat-card">
          <h3>氣流分離</h3>
          <p id="sepValue">穩定</p>
        </div>
      </div>

      <div class="control-panel">
        <label>
          風速調整
          <div class="slider-wrap">
            <input id="windSlider" type="range" min="0.8" max="3.2" step="0.05" value="1.8" />
            <div class="slider-value">
              <span>0.8 m/s</span>
              <span id="windSpeedLabel">1.80 m/s</span>
              <span>3.2 m/s</span>
            </div>
          </div>
        </label>
        <label>
          空氣黏性 (Viscosity)
          <div class="slider-wrap">
            <input id="viscositySlider" type="range" min="0.0" max="1.0" step="0.05" value="0.4" />
            <div class="slider-value">
              <span>0.0 (無黏性)</span>
              <span id="viscosityLabel">0.40</span>
              <span>1.0 (高黏性)</span>
            </div>
          </div>
        </label>
        <label>
          尾流回填壓力 (Pressure Recovery)
          <div class="slider-wrap">
            <input id="recoverySlider" type="range" min="0.0" max="1.0" step="0.05" value="0.5" />
            <div class="slider-value">
              <span>0.0 (無回填)</span>
              <span id="recoveryLabel">0.50</span>
              <span>1.0 (強回填)</span>
            </div>
          </div>
        </label>
        <div class="notes">
          <strong>提示：</strong>不同形狀的氣流分離位置與尾流長度會隨風速、黏性與回填壓力改變。<strong>空氣黏性</strong>會引發貼邊流動（康達效應），抑制紊流；<strong>回填壓力</strong>則模擬背風面的低壓吸引力，讓粒子在越過物體後迅速向中心線合攏，填補真空區。
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // SDF (帶符號距離函數) 碰撞輔助工具
    // ==========================================

    /**
     * 矩形 SDF（Signed Distance Field）
     * 給定點 (px, py) 與矩形的半寬 hw、半高 hh，
     * 回傳 { d: 帶符號距離, nx: 法線 x, ny: 法線 y }
     * d > 0 表示在外部，d < 0 表示穿入內部
     */
    function rectSDF(px, py, hw, hh) {
      // 取絕對值，將問題對稱化到第一象限處理
      const ax = Math.abs(px);
      const ay = Math.abs(py);
      // 計算到邊緣的距離向量 (dx, dy)
      const dx = ax - hw;
      const dy = ay - hh;

      // 外部距離：取正值部分的長度
      const outsideDist = Math.hypot(Math.max(dx, 0), Math.max(dy, 0));
      // 內部距離：取兩軸中最大值（離邊緣最近的距離，負值）
      const insideDist = Math.min(Math.max(dx, dy), 0);
      const d = outsideDist + insideDist;

      // 計算法線方向：指向離點最近的邊
      let nx, ny;
      if (dx > dy) {
        // 最近的邊是左右兩側
        nx = Math.sign(px) || 1;
        ny = 0;
      } else {
        // 最近的邊是上下兩側
        nx = 0;
        ny = Math.sign(py) || 1;
      }
      return { d, nx, ny };
    }

    /**
     * 點到線段的最短距離（平方值）
     * 用於多邊形 SDF 的內部計算
     * a, b 為線段兩端點，p 為查詢點
     */
    function pointSegDistSq(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      // 投影比例 t，限制在 [0,1] 確保點落在線段上
      const t = Math.max(0, Math.min(1, (apx * abx + apy * aby) / (abx * abx + aby * aby + 1e-12)));
      // 最近點到查詢點的距離平方
      const cx = ax + t * abx - px;
      const cy = ay + t * aby - py;
      return cx * cx + cy * cy;
    }

    /**
     * 多邊形 SDF
     * 使用繞數法 (winding number) 判斷內外，配合點到線段距離計算
     * vertices 為頂點陣列 [{x, y}, ...]
     * 回傳 { d: 帶符號距離, nx: 法線 x, ny: 法線 y }
     */
    function polygonSDF(px, py, vertices) {
      const n = vertices.length;
      let minDistSq = Infinity;
      let closestNx = 0;
      let closestNy = -1;
      let winding = 0; // 用於判斷點是否在多邊形內部

      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        const vix = vertices[i].x;
        const viy = vertices[i].y;
        const vjx = vertices[j].x;
        const vjy = vertices[j].y;

        // 計算到這條邊的距離平方
        const dSq = pointSegDistSq(px, py, vix, viy, vjx, vjy);

        if (dSq < minDistSq) {
          minDistSq = dSq;
          // 計算該邊的外法線方向（將邊向量旋轉 90 度）
          const edgeX = vjx - vix;
          const edgeY = vjy - viy;
          const edgeLen = Math.hypot(edgeX, edgeY) || 1e-12;
          // 外法線 = 邊向量逆時針旋轉 90 度 = (edgeY, -edgeX)
          closestNx = edgeY / edgeLen;
          closestNy = -edgeX / edgeLen;
        }

        // 繞數法 (winding number)：計算點繞多邊形的圈數
        if (viy <= py) {
          if (vjy > py) {
            // 邊從下往上穿過水平線
            const cross = (vjx - vix) * (py - viy) - (px - vix) * (vjy - viy);
            if (cross > 0) winding++;
          }
        } else {
          if (vjy <= py) {
            // 邊從上往下穿過水平線
            const cross = (vjx - vix) * (py - viy) - (px - vix) * (vjy - viy);
            if (cross < 0) winding--;
          }
        }
      }

      const dist = Math.sqrt(minDistSq);
      // 繞數 !== 0 表示點在多邊形內部，距離取負值
      const sign = winding !== 0 ? -1 : 1;

      // 確保法線方向指向外側
      // 從重心到查詢點的向量作為參考方向
      let cx = 0, cy = 0;
      for (const v of vertices) { cx += v.x; cy += v.y; }
      cx /= n; cy /= n;
      const toCenterX = px - cx;
      const toCenterY = py - cy;
      if (closestNx * toCenterX + closestNy * toCenterY < 0) {
        closestNx = -closestNx;
        closestNy = -closestNy;
      }

      return { d: sign * dist, nx: closestNx, ny: closestNy };
    }

    /**
     * 翼型 (Airfoil) 貝茲曲線取樣
     * 將原始繪製翼型的兩條二次貝茲曲線取樣為多邊形頂點
     * 上表面：(-96,16) → 控制點(-16,-46) → (108,-24)
     * 下表面：(108,-24) → 控制點(90,28) → (-94,22)
     * 合併為一個封閉多邊形供 SDF 計算使用
     */
    function sampleAirfoilVertices(segments) {
      const verts = [];
      // 上表面貝茲曲線取樣：起點 → 控制點 → 終點
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const mt = 1 - t;
        // 二次貝茲曲線公式：B(t) = (1-t)²·P0 + 2(1-t)t·P1 + t²·P2
        const x = mt * mt * (-96) + 2 * mt * t * (-16) + t * t * 108;
        const y = mt * mt * 16 + 2 * mt * t * (-46) + t * t * (-24);
        verts.push({ x, y });
      }
      // 下表面貝茲曲線取樣（反向回繞形成封閉多邊形）
      for (let i = 1; i <= segments; i++) {
        const t = i / segments;
        const mt = 1 - t;
        const x = mt * mt * 108 + 2 * mt * t * 90 + t * t * (-94);
        const y = mt * mt * (-24) + 2 * mt * t * 28 + t * t * 22;
        verts.push({ x, y });
      }
      return verts;
    }

    // 預先計算翼型多邊形頂點（32 段取樣，共 64 個頂點）
    const airfoilVertices = sampleAirfoilVertices(32);

    // 三角形頂點（與繪製函數中的座標一致）
    const triangleVertices = [
      { x: -86, y: 62 },
      { x: 98, y: 0 },
      { x: -86, y: -62 },
    ];

    // ==========================================
    // 形狀定義（含專屬 SDF 碰撞函數）
    // ==========================================

    const shapes = [
      {
        id: 'circle',
        name: '圓形',
        draw: drawCircle,
        baseCd: 1.2,
        baseCl: 0.1,
        separation: '中等',
        /**
         * 圓形 SDF：距離 = 到圓心距離 - 半徑
         * 負值表示在圓內，正值表示在圓外
         */
        sdf(px, py) {
          const r = 72; // 圓的半徑（與繪製一致）
          const dist = Math.hypot(px, py);
          const d = dist - r;
          // 法線方向 = 從圓心指向查詢點的單位向量
          const len = dist || 1e-12;
          return { d, nx: px / len, ny: py / len };
        },
      },
      {
        id: 'airfoil',
        name: '翼型',
        draw: drawAirfoil,
        baseCd: 0.18,
        baseCl: 0.85,
        separation: '延遲',
        /** 翼型 SDF：使用預計算的多邊形頂點進行精確碰撞檢測 */
        sdf(px, py) {
          return polygonSDF(px, py, airfoilVertices);
        },
      },
      {
        id: 'square',
        name: '方形',
        draw: drawSquare,
        baseCd: 2.3,
        baseCl: 0.05,
        separation: '強烈',
        /** 方形 SDF：半寬高 65（與繪製的 rect(-65,-65,130,130) 一致）*/
        sdf(px, py) {
          return rectSDF(px, py, 65, 65);
        },
      },
      {
        id: 'triangle',
        name: '三角形',
        draw: drawTriangle,
        baseCd: 1.8,
        baseCl: 0.18,
        separation: '明顯',
        /** 三角形 SDF：使用預定義的三角形頂點進行多邊形碰撞 */
        sdf(px, py) {
          return polygonSDF(px, py, triangleVertices);
        },
      },
      {
        id: 'flat',
        name: '平板',
        draw: drawFlatPlate,
        baseCd: 1.7,
        baseCl: 0.02,
        separation: '立即',
        /** 平板 SDF：寬 200 高 16 的矩形（與繪製的 rect(-100,-8,200,16) 一致）*/
        sdf(px, py) {
          return rectSDF(px, py, 100, 8);
        },
      },
    ];

    const canvas = document.getElementById('flowCanvas');
    const ctx = canvas.getContext('2d');
    const shapeButtons = document.getElementById('shapeButtons');
    const cdValue = document.getElementById('cdValue');
    const clValue = document.getElementById('clValue');
    const wakeValue = document.getElementById('wakeValue');
    const sepValue = document.getElementById('sepValue');
    const windSlider = document.getElementById('windSlider');
    const windSpeedLabel = document.getElementById('windSpeedLabel');

    // ==========================================
    // 全域變數與 DOM 元素
    // ==========================================
    let currentShape = shapes[1]; // 預設使用翼型
    let windSpeed = parseFloat(windSlider.value);
    
    // 取得新增的黏性與壓力滑桿元素
    const viscositySlider = document.getElementById('viscositySlider');
    const viscosityLabel = document.getElementById('viscosityLabel');
    const recoverySlider = document.getElementById('recoverySlider');
    const recoveryLabel = document.getElementById('recoveryLabel');
    
    // 解析黏性與回填壓力數值
    let viscosity = parseFloat(viscositySlider.value);
    let pressureRecovery = parseFloat(recoverySlider.value);

    let particles = [];
    const particleCount = 200; // 稍微增加粒子數以強化視覺流線感
    const flowColor = 'rgba(123, 219, 255, 0.75)';
    const trailColor = 'rgba(123, 219, 255, 0.12)';

    /**
     * 重設畫布大小並重新設定縮放比例
     */
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }

    /**
     * 初始化粒子系統，賦予每個粒子二維速度向量 (vx, vy) 
     */
    function initParticles() {
      particles = [];
      const width = canvas.width / window.devicePixelRatio;
      const height = canvas.height / window.devicePixelRatio;
      for (let i = 0; i < particleCount; i++) {
        // 賦予隨機初速度，並保留 baseSpeed 用於後續速度恢復
        const pSpeed = windSpeed * (0.6 + Math.random() * 0.8);
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: pSpeed, // x 方向速度
          vy: 0,      // y 方向速度
          baseSpeed: pSpeed,
          size: 1.2 + Math.random() * 2,
          phase: Math.random() * Math.PI * 2, // 用於紊流相位計算
        });
      }
    }

    /**
     * 更新粒子狀態（含黏性、貼邊效應、尾流回填壓力等物理機制）
     */
    function updateParticles() {
      const width = canvas.width / window.devicePixelRatio;
      const height = canvas.height / window.devicePixelRatio;
      
      // 物體在畫布中的中心座標
      const centerX = width * 0.42;
      const centerY = height * 0.5;

      // SDF 碰撞與偏折的參數
      const safeMargin = 8;     // 粒子不可進入的安全邊距（像素）
      const deflectRange = 42;  // 開始施加偏折與貼邊效應的範圍（像素）
      const dt = 0.9;           // 時間步長微調

      for (const p of particles) {
        // --- 1. 基礎速度恢復與紊流模擬 ---
        // 紊流強度：風速越高紊流越強，黏性越高則紊流被壓制得越平滑（層流穩定）
        const turbulenceIntensity = (1.0 - viscosity * 0.85) * (windSpeed * 0.38);
        p.phase += 0.016; // 更新波動相位
        
        // 基礎 X 軸速度漸漸恢復到其基本風速
        p.vx += (p.baseSpeed - p.vx) * 0.04;
        
        // 自然 Y 軸正弦波動（紊流）
        const naturalWave = Math.sin(p.phase + p.x * 0.02) * turbulenceIntensity;
        p.vy += (naturalWave - p.vy) * 0.04;

        // --- 2. 邊界回收機制 ---
        // 粒子飛出右側邊界後，重置回左側
        if (p.x > width + 20) {
          p.x = -30;
          p.y = Math.random() * height;
          const pSpeed = windSpeed * (0.6 + Math.random() * 0.8);
          p.vx = pSpeed;
          p.vy = 0;
          p.baseSpeed = pSpeed;
        }

        // --- 3. SDF 碰撞偵測與避障 (包含康達貼邊效應) ---
        // 將粒子位置轉換至以物體中心為原點的局部座標系
        const localX = p.x - centerX;
        const localY = p.y - centerY;

        // 計算目前點到障礙物表面的 Signed Distance Field 與法線向量
        const res = currentShape.sdf(localX, localY);

        if (res.d < safeMargin) {
          // A. 穿透修正：立刻將粒子推回安全邊距外，避免穿入物體內部
          const pushDist = safeMargin - res.d + 1.2;
          p.x += res.nx * pushDist;
          p.y += res.ny * pushDist;

          // B. 邊界切線滑行：計算切線方向，並使粒子沿切線流動
          const tx = -res.ny;
          const ty = res.nx;
          
          // 確保切線方向與原本前進方向 (vx) 同向
          const dot = p.vx * tx + p.vy * ty;
          const flowDir = dot >= 0 ? 1 : -1;
          const tangentVx = tx * flowDir;
          const tangentVy = ty * flowDir;

          // 計算切線速度。黏性越高，摩擦力越大，切線速度會被稍微減緩 (邊界層效應)
          const slipFactor = 0.92 - viscosity * 0.28;
          const currentSpeed = Math.hypot(p.vx, p.vy);
          p.vx = tangentVx * currentSpeed * slipFactor;
          p.vy = tangentVy * currentSpeed * slipFactor;

        } else if (res.d < deflectRange) {
          // C. 平滑偏折與貼邊效應 (Coandă Effect)
          const factor = (deflectRange - res.d) / deflectRange; // 0 → 1
          const deflectStrength = factor * factor; // 使用平方衰減，越近力越強

          // 彈開力（向外）：氣流遇到物體自然被推開的力
          const pushForceX = res.nx * deflectStrength * 1.5;
          const pushForceY = res.ny * deflectStrength * 3.5;

          // 貼邊力（向內）：空氣黏性帶來的附著力，會拉扯粒子貼近物體表面流動
          const stickForceX = -res.nx * viscosity * deflectStrength * 1.2;
          const stickForceY = -res.ny * viscosity * deflectStrength * 3.0;

          // 疊加兩力，更新粒子速度
          p.vx += pushForceX + stickForceX;
          p.vy += pushForceY + stickForceY;
        }

        // --- 4. 尾流合攏機制 (Wake Closure / Pressure Recovery) ---
        // 當空氣粒子越過物體 (localX > 0) 且進入物體背風面的投影陰影區時，
        // 黏性與低壓產生的「回填壓力」會將粒子拉向中心線 (centerY)，從而消除真空區。
        if (localX > 0 && localX < 280) {
          const distToCenter = p.y - centerY;
          // 根據物體形狀動態調整尾流陰影的半高度
          const shadowHeight = currentShape.id === 'flat' ? 110 : (currentShape.id === 'airfoil' ? 35 : 85);
          
          if (Math.abs(distToCenter) < shadowHeight) {
            // 距離因子：離物體越遠，回填效應慢慢減弱 (線性衰減)
            const distanceFactor = 1.0 - (localX / 280);
            
            // 回填力強度由使用者設定的「壓力回復」滑桿控制
            const pullForce = pressureRecovery * 0.45 * distanceFactor;
            
            // 對粒子施加拉回中心線的垂直加速度，強度與偏離中心線的距離呈正比
            p.vy -= Math.sign(distToCenter) * pullForce * (Math.abs(distToCenter) / shadowHeight);
          }
        }

        // --- 5. 尾流紊流漩渦效果 ---
        // 在物體下游且靠近中心線的地方，粒子會受到脫落漩渦 (Vortex) 的擾動
        if (localX > 30 && Math.abs(localY) < 95) {
          // 平板和圓形產生的脫落紊流較多，翼型產生的流線型阻力極小，故紊流也極小
          const turbFactor = currentShape.id === 'airfoil' ? 0.15 : (currentShape.id === 'flat' ? 1.6 : 1.0);
          
          // 空氣黏性會壓制並平滑化脫落紊流
          const viscosityDamp = 1.0 - viscosity * 0.8;
          p.vy += Math.sin(localX * 0.08 + p.phase) * 0.45 * turbFactor * viscosityDamp * (windSpeed * 0.5);
        }

        // 平板在高風速下有額外的分離紊流效果
        if (windSpeed > 2.4 && currentShape.id === 'flat') {
          p.vy += Math.sin(localX * 0.16 + p.phase) * 0.35 * (1.0 - viscosity * 0.7);
        }

        // --- 6. 套用位移與上下邊界回收 ---
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        // 上下越界回收：若粒子飛出畫布上下緣，重置至左側區域，保持流動循環
        if (p.y < -20 || p.y > height + 20) {
          p.y = Math.random() * height;
          p.x = Math.random() * (width * 0.3); // 隨機分佈在左側 1/3，避免出現成排空白
          const pSpeed = windSpeed * (0.6 + Math.random() * 0.8);
          p.vx = pSpeed;
          p.vy = 0;
          p.baseSpeed = pSpeed;
        }
      }
    }

    /**
     * 清除畫布並以帶透明度的背景填滿，實現粒子運動時的殘影 (Motion Blur) 效果
     */
    function drawBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(2, 15, 30, 0.16)';
      ctx.fillRect(0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
    }

    /**
     * 繪製粒子及其尾跡 (Trails)
     */
    function drawParticles() {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter'; // 使用混色模式使氣流交會處更亮麗
      ctx.strokeStyle = flowColor;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      for (const p of particles) {
        // 尾跡長度與粒子當前的速度 (vx, vy) 成正比，且方向完全與運動向量反向
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.7, p.y - p.vy * 0.7);
      }
      ctx.stroke();
      ctx.restore();

      // 繪製粒子本體圓點
      for (const p of particles) {
        ctx.fillStyle = flowColor;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawShape() {
      const width = canvas.width / window.devicePixelRatio;
      const height = canvas.height / window.devicePixelRatio;
      ctx.save();
      ctx.translate(width * 0.42, height * 0.5);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.strokeStyle = 'rgba(79, 214, 255, 0.82)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(79, 214, 255, 0.22)';
      ctx.shadowBlur = 16;
      currentShape.draw(ctx, width, height);
      ctx.restore();
    }

    function drawCircle(ctx) {
      ctx.beginPath();
      ctx.arc(0, 0, 72, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    function drawAirfoil(ctx) {
      ctx.beginPath();
      ctx.moveTo(-96, 16);
      ctx.quadraticCurveTo(-16, -46, 108, -24);
      ctx.quadraticCurveTo(90, 28, -94, 22);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function drawSquare(ctx) {
      ctx.beginPath();
      ctx.rect(-65, -65, 130, 130);
      ctx.fill();
      ctx.stroke();
    }

    function drawTriangle(ctx) {
      ctx.beginPath();
      ctx.moveTo(-86, 62);
      ctx.lineTo(98, 0);
      ctx.lineTo(-86, -62);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function drawFlatPlate(ctx) {
      ctx.beginPath();
      ctx.rect(-100, -8, 200, 16);
      ctx.fill();
      ctx.stroke();
    }

    function updateMetrics() {
      const speedFactor = windSpeed / 1.8;
      const cd = currentShape.baseCd * (0.72 + 0.22 * speedFactor * 0.9);
      const cl = currentShape.baseCl * (0.92 + 0.28 * speedFactor);
      const wake = Math.max(1.2, 3.6 * speedFactor * (currentShape.baseCd / 1.3));
      const sep = currentShape.separation;

      cdValue.textContent = cd.toFixed(2);
      clValue.textContent = cl.toFixed(2);
      wakeValue.textContent = wake.toFixed(1) + ' m';
      sepValue.textContent = sep;
    }

    function animate() {
      drawBackground();
      drawParticles();
      drawShape();
      updateParticles();
      requestAnimationFrame(animate);
    }

    function createShapeButtons() {
      shapes.forEach((shape) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'shape-button';
        button.textContent = shape.name;
        button.dataset.shapeId = shape.id;
        if (shape === currentShape) {
          button.classList.add('active');
        }
        button.addEventListener('click', () => {
          currentShape = shape;
          Array.from(shapeButtons.children).forEach((btn) => btn.classList.remove('active'));
          button.classList.add('active');
          updateMetrics();
        });
        shapeButtons.appendChild(button);
      });
    }

    function handleWindChange() {
      windSpeed = parseFloat(windSlider.value);
      windSpeedLabel.textContent = windSpeed.toFixed(2) + ' m/s';
      initParticles();
      updateMetrics();
    }

    // 新增空氣黏性變更事件處理
    function handleViscosityChange() {
      viscosity = parseFloat(viscositySlider.value);
      viscosityLabel.textContent = viscosity.toFixed(2);
      updateMetrics();
    }

    // 新增尾流回填壓力變更事件處理
    function handleRecoveryChange() {
      pressureRecovery = parseFloat(recoverySlider.value);
      recoveryLabel.textContent = pressureRecovery.toFixed(2);
      updateMetrics();
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
    });

    windSlider.addEventListener('input', handleWindChange);
    viscositySlider.addEventListener('input', handleViscosityChange);
    recoverySlider.addEventListener('input', handleRecoveryChange);

    createShapeButtons();
    resizeCanvas();
    initParticles();
    updateMetrics();
    animate();
  </script>
</body>
</html>
